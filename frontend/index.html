<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <span class="logo">GAME LIBRARY</span>
            <input type="search" id="search" placeholder="Search your library" aria-label="Search your library">
            <button type="button" id="add-btn" class="btn btn-green">Add a game</button>
        </div>
    </header>

    <main class="page">
        <div class="section-bar">
            <h1>Your library <span id="game-count"></span></h1>
        </div>

        <!-- Loading / error / empty states for the list -->
        <div id="status" class="status hidden" role="status"></div>

        <!-- List view: game tiles are injected here by app.js -->
        <div id="game-list" class="game-grid"></div>
    </main>

    <!-- Detail view (GET by id) -->
    <dialog id="detail-dialog" class="modal" aria-labelledby="detail-title">
        <div id="detail-content"></div>
    </dialog>

    <!-- Add / Edit form (POST and PUT) -->
    <dialog id="form-dialog" class="modal" aria-labelledby="form-title">
        <form id="game-form" novalidate>
            <h2 id="form-title">Add a game</h2>
            <div id="form-error" class="error hidden" role="alert"></div>

            <input type="hidden" id="game-id">

            <div class="field">
                <label for="game-title">Title</label>
                <input type="text" id="game-title" placeholder="e.g. Elden Ring">
            </div>
            <div class="field">
                <label for="game-genre">Genre</label>
                <input type="text" id="game-genre" placeholder="e.g. Action RPG">
            </div>
            <div class="field">
                <label for="game-platform">Platform</label>
                <input type="text" id="game-platform" placeholder="e.g. PC, PlayStation 5">
            </div>
            <div class="field-row">
                <div class="field">
                    <label for="game-year">Release year</label>
                    <input type="number" id="game-year" placeholder="e.g. 2022">
                </div>
                <div class="field">
                    <label for="game-rating">Rating (0-10)</label>
                    <input type="number" id="game-rating" step="0.1" min="0" max="10" placeholder="e.g. 9.6">
                </div>
            </div>

            <div class="modal-actions">
                <button type="button" id="cancel-btn" class="btn btn-blue">Cancel</button>
                <button type="submit" id="submit-btn" class="btn btn-green">Add to library</button>
            </div>
        </form>
    </dialog>

    <script src="app.js"></script>
</body>
</html>
